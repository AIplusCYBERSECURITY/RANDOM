<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interactive Web Experience</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            overflow: hidden;
            background-color: #0d0e15;
            color: #ffffff;
        }
        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            outline: none;
            z-index: 1;
        }
        .content {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            pointer-events: none;
        }
      h1 {
    font-size: 3.5rem;
    background: linear-gradient(45deg, #ff007f, #7f00ff);
    -webkit-background-clip: text;
    background-clip: text; /* Yeh line add karein */
    -webkit-text-fill-color: transparent;
}
        p {
            font-size: 1.2rem;
            color: #a0a0b0;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>
    
    <div class="content">
        <h1>Next-Gen 3D Web</h1>
        <p>Interactive 3D Scene powered by Three.js and Python Flask Back-end.</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="static/script.js"></script>
</body>
</html>
